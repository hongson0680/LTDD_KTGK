version: '3'

services:

  abp_host:
    image: abp/mvc
    environment:
      ASPNETCORE_ENVIRONMENT: "Staging"
      ConnectionStrings__Default: "${DB_CONNECTION_STRING:?Set DB_CONNECTION_STRING in the environment or .env file}"
      TZ: "America/Toronto"
      Kestrel__Endpoints__Http__Url: "http://+:80"
    ports:
      - "44312:80"
    volumes:
      - "./Mvc-Logs:/app/App_Data/Logs"
    restart: always
